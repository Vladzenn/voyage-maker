name: Validate Voyage world
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python tools/project.py validate
      - run: python tools/test_validation.py
      - run: python tools/test_voyage_portraits.py
      - run: python tools/project.py sync --check
      - run: node tools/test_item_mechanics.cjs
      - run: node tools/test_adventurers.cjs
      - run: node tools/test_creation.cjs
      - run: node tools/test_crucible.cjs
